<div fxLayout="column" fxLayoutAlign="start stretch" class="container">
  
  <mat-card fxFlex="none" class="mb-3">
    <mat-card-content>
      <div fxLayout="column" fxLayoutAlign="start stretch">

        <mat-form-field appearance="outline" fxFlex="100">
          <mat-label>Select Organizations (Codes: {{ orgControl.value?.join(', ') }})</mat-label>
          
          <input 
            type="text" 
            placeholder="Search by Code or Name" 
            aria-label="Organization Search" 
            matInput 
            [formControl]="searchInputControl" 
            [matAutocomplete]="auto">
          
          <mat-chip-grid #chipGrid aria-label="Organization selection">
            <mat-chip-row *ngFor="let code of orgControl.value" (removed)="removeOrg(code)">
              {{ code }}
              <button matChipRemove aria-label="Remove organization">
                <mat-icon>cancel</mat-icon>
              </button>
            </mat-chip-row>
          </mat-chip-grid>

          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let org of filteredOrganizations$ | async" [value]="org.code" (click)="onOrgSelected(org.code)">
              <span class="org-code">{{ org.code }}</span> 
              <span> - </span>
              <span class="org-name">{{ org.name }}</span>
            </mat-option>
          </mat-autocomplete>

        </mat-form-field>
      </div>

    </mat-card-content>
  </mat-card>
  <mat-card fxFlex="50" class="ag-grid-card mb-3">
    <mat-card-header>
        <mat-card-title>Available Employees (Click 'Select' to move)</mat-card-title>
    </mat-card-header>
    <mat-card-content fxFlex="grow">
      <div class="ag-theme-alpine" style="height: 100%; width: 100%;">
        <ag-grid-angular
          style="width: 100%; height: 100%;"
          
          [columnDefs]="mainColumnDefs"
          [defaultColDef]="defaultColDef"
          [animateRows]="true"
          [context]="gridContext"
          (gridReady)="onMainGridReady($event)"
        >
        </ag-grid-angular>
      </div>
      <mat-progress-spinner *ngIf="isLoadingEmployees()" mode="indeterminate" diameter="50"></mat-progress-spinner>
    </mat-card-content>
  </mat-card>

    <mat-card-header>
        <mat-card-title>Selected Employees (Total: {{ selectedEmployeeData().length }})</mat-card-title>
    </mat-card-header>
   
    <mat-card-content fxFlex="grow">
