<div class="container-fluid py-2">
    <div class="row align-items-start">
      <!-- Left: Multiwell Canvas -->
      <div class="col-lg-8 col-md-7 col-sm-12 mb-3">
        <canvas #correlationDisplay class="w-100 border border-secondary" height="600"></canvas>
      </div>
  
      <!-- Right: Dynamic Mnemonic Widgets -->
      <div class="col-lg-4 col-md-5 col-sm-12">
        <app-rcc-multi-well-widgets
          *ngFor="let well of wellWidgets"
          [wellName]="well.wellName"
          [widgets]="well.widgets"
        ></app-rcc-multi-well-widgets>
      </div>
    </div>
  </div>










  <div class="container-fluid py-2">
    <div class="row g-3">
      <!-- One tile per well (responsive: 5/row on xl, 4/row on lg, etc.) -->
      <div
        class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2"
        *ngFor="let well of wellTiles; let i = index"
      >
        <div class="well-card bg-dark text-light p-2 rounded shadow-sm h-100">
          <div class="d-flex gap-2">
            <!-- LEFT: canvas (one per well) -->
            <div class="flex-grow-1">
              <canvas #wellCanvas class="w-100 border border-secondary rounded" height="250"></canvas>
            </div>
  
            <!-- RIGHT: widgets (mnemonics/last values) -->
            <div class="flex-grow-1" style="min-width: 160px;">
              <app-rcc-multi-well-widgets
                [wellName]="well.wellName"
                [widgets]="well.widgets">
              </app-rcc-multi-well-widgets>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
