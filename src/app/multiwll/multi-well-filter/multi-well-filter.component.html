<div class="filter-container">
  <h3>Multi-Well Filter</h3>

  <form [formGroup]="fb.group({ wells: wellsForm })">
    <div formArrayName="wells">
      <div class="well-row" *ngFor="let item of wellsForm.controls; let i = index" [formGroupName]="i">
        <!-- Well Dropdown -->
        <mat-form-field appearance="outline" class="field">
          <mat-label>Well</mat-label>
          <mat-select formControlName="selectedWell" [compareWith]="compareObjects">
            <mat-option *ngFor="let well of wellsList" [value]="well">
              {{ well.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Wellbore Dropdown -->
        <mat-form-field appearance="outline" class="field">
          <mat-label>Wellbore</mat-label>
          <mat-select formControlName="selectedWellbore" [compareWith]="compareObjects">
            <mat-option *ngFor="let wb of getWellboresFor(item.value.selectedWell)" [value]="wb">
              {{ wb.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Mnemonics Dropdown -->
        <mat-form-field appearance="outline" class="field">
          <mat-label>Mnemonics</mat-label>
          <mat-select formControlName="selectedMnemonics" multiple [compareWith]="compareObjects">
            <mat-option *ngFor="let m of mnemonicsList" [value]="m">
              {{ m.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-icon-button color="warn" (click)="removeWell(i)" aria-label="Remove">
          ✕
        </button>
      </div>
    </div>
  </form>

  <div class="buttons">
    <button mat-raised-button color="primary" (click)="addWell()">Add Well</button>
    <button mat-raised-button color="accent" (click)="save()">Save</button>
    <button mat-stroked-button color="warn" (click)="cancel()">Cancel</button>
  </div>
</div>
