<div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Login</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form (ngSubmit)="login()" #loginForm="ngForm">
          <mat-form-field appearance="fill" class="full-width-input">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="user.email" name="email" required>
          </mat-form-field>
          <mat-form-field appearance="fill" class="full-width-input">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="user.password" name="password" required>
          </mat-form-field>
          <div class="link-container">
            <a routerLink="/register">New User? Register here.</a>
          </div>
          <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.form.valid">Log In</button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
