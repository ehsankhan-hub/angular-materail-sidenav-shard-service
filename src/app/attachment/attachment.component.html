<div class="attachments-container" fxLayout="column" fxLayoutGap="15px">

    <input 
      type="file" 
      #fileInput 
      (change)="onFileSelected($event)" 
      style="display: none;" 
      [accept]="ALLOWED_TYPES.join(',')"
      multiple 
    >
  
    <mat-toolbar class="header-toolbar" fxLayout="row" fxLayoutAlign="start center"> 
      <span class="toolbar-title">Change Request Attachments</span>
    </mat-toolbar>
  
    <mat-card class="attachments-card" fxLayout="column">
      
      <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="15px" class="action-bar-top">
        
        <div class="count-display">Attached: {{ rowData.length }}/{{ rowData.length }}</div>
  
        <span fxFlex></span> 
  
        <mat-form-field appearance="outline" class="search-input">
          <input matInput 
                 [formControl]="searchCtrl" 
                 (keyup.enter)="applySearch()" 
                 placeholder="search and click enter">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
  
        <button mat-icon-button color="primary" (click)="refreshData()" matTooltip="Refresh Data" class="green-button">
          <mat-icon>refresh</mat-icon>
        </button>
        <button mat-icon-button color="primary" (click)="viewDetails()" matTooltip="View Details" class="green-button">
          <mat-icon>visibility</mat-icon>
        </button>
  
      </div>
  
      <mat-divider></mat-divider>
  
      <div 
        class="dropzone" 
        [class.drag-over]="isDragging"
        (click)="triggerFileInput()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        fxLayout="column" fxLayoutAlign="center center"
      >
          <mat-icon class="dropzone-icon">cloud_upload</mat-icon>
          <p class="mat-body-1" *ngIf="!isDragging">Drag & drop files here, or click to browse</p>
          <p class="mat-body-1" *ngIf="isDragging">Drop files to attach</p>
          <button mat-stroked-button color="primary" class="browse-button">
              Browse Files
          </button>
      </div>
  
      <div class="ag-grid-wrapper" fxFlex>
          <ag-grid-angular
            #agGrid
            style="width: 100%; height: 350px;" 
            class="ag-theme-alpine attachment-grid"
            [rowData]="rowData"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            (gridReady)="onGridReady($event)"
            [suppressRowClickSelection]="true"
            [rowSelection]="'multiple'"
            [context]="{componentParent: this}"
          >
          </ag-grid-angular>
          <div *ngIf="rowData.length === 0" class="no-rows-overlay-table">
              No attached files. Use the dropzone above to add documents.
          </div>
      </div>
    </mat-card>
  </div>
