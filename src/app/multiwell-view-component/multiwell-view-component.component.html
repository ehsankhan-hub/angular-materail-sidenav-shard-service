<div class="container-fluid py-3">
  <div class="row gy-3">
    <!-- One well track per card -->
    <div
      class="col-12 col-md-6 col-lg-4"
      *ngFor="let well of lstOfTrack; let i = index"
    >
      <mat-card class="well-card border border-secondary">
        <mat-card-header class="bg-dark text-light">
          <mat-card-title>
            {{ well.wellName }} — {{ well.wellboreName }}
          </mat-card-title>
        </mat-card-header>

        <mat-card-content class="p-2">
          <div class="row g-2 align-items-stretch">
            <!-- Left: INT.com Canvas -->
            <div class="col-12 col-md-8">
              <div class="canvas-container">
                <canvas #canvasTrack class="well-canvas"></canvas>
              </div>
            </div>

            <!-- Right: Widgets for this well only -->
            <div class="col-12 col-md-4">
              <div class="widget-panel">
                <mat-card
                  *ngFor="let w of well.widgets"
                  class="status-card mb-2 p-2"
                >
                  <div class="d-flex justify-content-between align-items-center">
                    <div class="fw-semibold">{{ w.name }}</div>
                    <div class="text-end">
                      {{ w.value | number:'1.2-2' }}
                      <small class="text-muted">{{ w.unit }}</small>
                    </div>
                  </div>
                </mat-card>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
